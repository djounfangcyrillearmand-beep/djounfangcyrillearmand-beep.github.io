function perf(p,M){const mp=Math.max(10,(M.t-(p.t0||0))/60),raw=(.25*(p.rc||0)+1.2*(p.gl||0)+.12*(p.sh||0)+4*(p.xq||0)+.01*(p.pa||0)-.14*(p.ls||0))*(90/mp);return 6.2+raw*.3}

if(lead===0&&mn>=65)return[1,`Match nul tard dans le match : Plan B pour chercher la victoire.`];
return[0,`Score et temps de jeu normaux : garde le Plan A.`]}
function rPlb(f){if(!M||!$(`plb`))return;const[k,tx]=sugg(),sig=S.cur+`|`+tx+`|`+S.plans.length;if(!f&&M.plSig===sig)return;M.plSig=sig;
$(`plb`).innerHTML=`<b>Plan de jeu</b><div class="r">${S.plans.map((q,i)=>`<button class="${i===S.cur?`pri`:``}" onclick="switchPlan(${i})">${i===k&&i!==S.cur?`💡 `:``}${q.n.split(` — `)[0]}</button>`).join(``)}</div><p class="m">${S.plans[S.cur].n} · ${FN[S.plans[S.cur].str|0]}<br>${tx}</p>`}
function expCard(){return`<div class="c"><h3>Sauvegarde portable</h3><p class="m">Ta partie est enregistrée dans ce navigateur, pour ce fichier ou ce lien. Pour la garder quand tu changes de fichier ou de téléphone : appuie sur « Exporter », copie le code, puis dans la nouvelle version colle-le ici et appuie sur « Importer ».</p><textarea id="sx" rows="4" style="width:100%;font:inherit;padding:8px" placeholder="Le code de sauvegarde apparaît ici"></textarea><div class="r"><button class="pri" onclick="expSave()">Exporter</button><button onclick="impSave()">Importer</button></div></div>`}
function expSave(){const e=$(`sx`);e.value=`FCMU1:`+btoa(unescape(encodeURIComponent(JSON.stringify(S))));e.focus();e.select();try{navigator.clipboard.writeText(e.value)}catch(x){}alert(`Code de sauvegarde prêt : copie-le (il est aussi dans la case).`)}
function impSave(){let v=($(`sx`).value||``).trim();if(!v)return alert(`Colle d’abord le code de sauvegarde.`);try{if(v.startsWith(`FCMU1:`))v=decodeURIComponent(escape(atob(v.slice(6))));const x=JSON.parse(v);if(!x.teams)throw 0;if(!confirm(`Remplacer la partie actuelle par cette sauvegarde ?`))return;S=x;applyPack();applyTactic();if(S.asub==null)S.asub=1;if(!S.cup)cupInit();if(!S.eu)S.eu=euInit();save();show(`car`)}catch(e){alert(`Code invalide.`)}}
function switchPlan(k){if(!M||M.over||k===S.cur)return;const p=S.plans[k];S.cur=k;Object.assign(M.tac[0],p.t);p.kw.forEach(x=>kwOn(M,x,3));M.att=p.att?1:0;M.attS=M.st[1].shots;if(M.att)M.attU=1;M.pbD=1;M.auto=p.auto?1:0;M.sync=1;M.nc=0;M.log.unshift(`${fmt(M.t)} 🔁 Changement de plan : ${p.n} (${FN[p.str|0]})`);save();rPlb(1)}
if(S.asub==null)S.asub=1;
show(`car`);frame();
</script><script>
(function(){
var TEAMS=["FC Horizon","AS Montagne","Union Littoral","FC Savane","Académie Nord","Racing Centre","Olympique Ouest","Stade Capital"];
var TRACKS=[["Damso — Aux Paradis","musique/damso-aux-paradis.mp3"],["Gaulois — Jolie (feat. Ninho)","musique/gaulois-jolie.mp3"],["Ninho — Eurostar (feat. Central Cee)","musique/ninho-eurostar.mp3"]];
var H=document.getElementById("home"),au=new Audio(),ti=0,want=true;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function prof(){return localStorage.getItem("fcmu_prof")||""}
function setProf(){var v=(document.getElementById("hp")||{}).value;v=(v||"").trim();if(v)localStorage.setItem("fcmu_prof",v);else if(!prof())localStorage.setItem("fcmu_prof","Coach")}
function go(){try{sessionStorage.setItem("fcmu_go","1")}catch(e){}location.reload()}
function playT(i){ti=(i+TRACKS.length)%TRACKS.length;au.src=TRACKS[ti][1];au.onended=function(){playT(ti+1)};if(want)au.play().catch(function(){})}
window.musicPlay=function(){want=true;if(!au.src)playT(0);else au.play().catch(function(){})};
window.musicStop=function(){au.pause()};
window.musToggle=function(){if(au.paused){want=true;musicPlay()}else{want=false;au.pause()}};
window.musNext=function(){want=true;playT(ti+1)};
function home(){
 H.innerHTML='<div class="glow"></div><div class="box"><div class="logo">FCM</div><div class="ped">ULTRA</div><div class="pan"><label>Identifiant du manager<input id="hp" maxlength="20" placeholder="Ton identifiant" value="'+esc(prof())+'"></label><button class="p" onclick="hSetup()">🚀 DÉBUTER UNE CARRIÈRE</button><button onclick="hLoad()">📂 CHARGER UNE PARTIE</button><div style="font-size:12px;color:#9aa9c3;margin-top:10px">Aucune carrière ne démarre toute seule : tu choisis ton club et tes paramètres.</div></div></div>';
}
window.hSetup=function(){setProf();musicPlay();
 H.querySelector(".pan").innerHTML='<h3 style="margin:0 0 6px">Nouvelle carrière</h3><label>Nom du manager<input id="cm" value="'+esc(prof())+'"></label><label>Club à manager<select id="cc">'+TEAMS.map(function(t){return "<option>"+t+"</option>"}).join("")+'</select></label><label>Difficulté<select id="cd"><option value="76">Facile</option><option value="77" selected>Réaliste</option><option value="78">Difficile</option><option value="79">Élite</option></select></label><label>Budget initial<select id="cb"><option value="20">Modeste</option><option value="40" selected>Normal</option><option value="80">Confortable</option><option value="150">Très riche</option></select></label><div style="font-size:12px;color:#9aa9c3">Toutes les équipes démarrent à 77-78 (Difficile et Élite : adversaires un peu plus forts).</div><button class="p" onclick="hCreate()">CRÉER LA CARRIÈRE</button><button onclick="home()">RETOUR</button>';
};
window.hCreate=function(){
 var club=document.getElementById("cc").value,lv=+document.getElementById("cd").value,name=(document.getElementById("cm").value||"Coach").trim();
 localStorage.setItem("fcmu_prof",name);
 var N=newS(),order=[club].concat(TEAMS.filter(function(t){return t!==club}));
 N.teams=order.map(function(n,i){var base=i===0?77+(R()<.5?0:1):lv+(R()<.5?0:1)-(lv>78?0:0);return Object.assign(mkTeam(n,base),{pts:0,gf:0,ga:0,p:0})});
 N.mgr=name;N.boost=1;N.attM=0;N.v4=1;N.money=+document.getElementById("cb").value;
 var j=JSON.stringify(N);localStorage.setItem("fcmu1",j);localStorage.setItem("fcmu_p_"+name,j);go();
};
window.hLoad=function(){setProf();musicPlay();
 var L=Object.keys(localStorage).filter(function(k){return k.indexOf("fcmu_p_")===0||/^fcmu_s\d+$/.test(k)}),h='<h3 style="margin:0 0 6px">Parties sauvegardées</h3>';
 if(!L.length)h+='<p>Aucune sauvegarde pour le moment.</p>';
 L.forEach(function(k){var s;try{s=JSON.parse(localStorage.getItem(k))}catch(e){return}if(!s||!s.teams)return;
  var lab=k.indexOf("fcmu_p_")===0?"Profil "+k.slice(7):"Slot "+k.slice(6);
  h+='<div class="sv"><div><b>'+esc(lab)+'</b><br>'+esc(s.teams[0].name||"")+' · Saison '+s.season+' · Journée '+(s.rd+1)+'</div><button class="p" data-k="'+esc(k)+'">CHARGER</button></div>'});
 H.querySelector(".pan").innerHTML=h+'<button onclick="home()">RETOUR</button>';
 H.querySelectorAll("button[data-k]").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-k");localStorage.setItem("fcmu1",localStorage.getItem(k));if(k.indexOf("fcmu_p_")===0)localStorage.setItem("fcmu_prof",k.slice(7));go()}});
};
window.home=home;
function inGame(){try{return sessionStorage.getItem("fcmu_go")==="1"}catch(e){return false}}
if(inGame()){H.style.display="none";document.addEventListener("click",function f(){if(want)musicPlay();document.removeEventListener("click",f)})}else{home()}
// music rules: stop at match start, resume after the final whistle
var _bu=buildUI;buildUI=function(){musicStop();return _bu.apply(this,arguments)};
var _em=endMatch;endMatch=function(){var r=_em.apply(this,arguments);setTimeout(function(){if(want)musicPlay()},3500);return r};
if(typeof quit==="function"){var _q=quit;quit=function(){var r=_q.apply(this,arguments);setTimeout(function(){if(want)musicPlay()},800);return r}}
})();
</script></body></html>
