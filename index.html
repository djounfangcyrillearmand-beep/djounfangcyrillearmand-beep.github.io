$(`sl`).innerHTML=[[`risk`,`Risque`],[`press`,`Pressing`],[`width`,`Largeur`],[`depth`,`Hauteur du bloc`]].map(([k,l])=>`<label>${l} <b id="v_${k}">${S.tac[k]}</b><input type=range min=0 max=100 value="${S.tac[k]}" id="i_${k}" oninput="S.tac.${k}=+this.value;$('v_${k}').textContent=this.value"></label>`).join(``)}
function cmd(k){if(!M||M.over)return;const f=120*(1+S.mast[k]/100);
if(k===`LARGEUR`)S.tac.width=Math.min(100,S.tac.width+20);else if(k===`SUPÉRIORITÉ`)M.fx.sup=f;else if(k===`PROTÈGE`)M.fx.prot=f;else if(k===`3 SECONDES`)M.fx.cp=f;else if(k===`COMPACT`)M.fx.comp=f;else if(k===`PROFONDEUR`)M.fx.deep=f*.6;else if(k===`SCORE`)M.auto=M.auto?0:1;
else if(M.sub<3){M.sub++;M.a[0].pl.filter(p=>p.i>0).sort((a,b)=>b.fat-a.fat).slice(0,3).forEach(p=>p.fat=Math.max(0,p.fat-.25))}
for(const q in S.tac){const e=$(`i_`+q);if(e){e.value=S.tac[q];$(`v_`+q).textContent=S.tac[q]}}M.log.unshift(`Commande ${k}`)}
function hud(){rPlb();if(M.sync){M.sync=0;for(const q in S.tac){const e=$(`i_`+q);if(e){e.value=S.tac[q];$(`v_`+q).textContent=S.tac[q]}}}const k=M.st[0],c=M.st[1],cf=M.cf[0],tot=M.ps[0]+M.ps[1]||1,u=M.a[0].pl,fa=u.reduce((a,p)=>a+p.fat,0)/11,
sh=cf.sh===SH.P3?`4-2-3-1`:cf.sh===SH.D3?`4-2-3-1 bas`:cf.sh===SH.P?`3-2-5`:cf.sh===SH.P2?`4-3-3`:cf.sh===SH.L?`4-5-1`:cf.sh===SH.D2?`4-3-3 médian`:`4-4-2`,ph={P:`Possession`,T:`Perte`,D:`Défense`}[cf.ph];
$(`hud`).innerHTML=`<div class="hud"><span>${M.a[0].name}</span><span class="big">${M.sc[0]} — ${M.sc[1]}</span><span>${M.a[1].name}</span></div><div class="m">${fmt(Math.min(M.t,M.len))} · ${ph} · structure ${sh} · transition ${M.trT[0]} · rest defense ${cf.rest} · fatigue ${Math.round(fa*100)}% · score auto ${M.auto?`ON`:`OFF`}</div>`;
$(`stt`).innerHTML=`<table><tr><th></th><th>Nous</th><th>Eux</th></tr><tr><td>Possession</td><td>${Math.round(M.ps[0]/tot*100)}%</td><td>${Math.round(M.ps[1]/tot*100)}%</td></tr><tr><td>Tirs / xG</td><td>${k.shots} / ${k.xg.toFixed(2)}</td><td>${c.shots} / ${c.xg.toFixed(2)}</td></tr><tr><td>Récup. (hautes)</td><td>${k.rec} (${k.recHigh})</td><td>${c.rec} (${c.recHigh})</td></tr><tr><td>Progressions</td><td>${k.prog}</td><td>${c.prog}</td></tr><tr><td>Tirs concédés après perte</td><td>${k.cShots}</td><td>${c.cShots}</td></tr><tr><td>Corners (buts/contres)</td><td>${k.cor} (${k.cG}/${k.cC})</td><td>${c.cor} (${c.cG}/${c.cC})</td></tr><tr><td>Coups francs obtenus</td><td>${k.fk}</td><td>${c.fk}</td></tr><tr><td>Transitions A/B/C</td><td>${k.tr.A}/${k.tr.B}/${k.tr.C}</td><td>${c.tr.A}/${c.tr.B}/${c.tr.C}</td></tr></table><p class="m">${M.att?`Attraction contrôlée : active (${M.attR} récup.)`:M.attU?`Attraction contrôlée : annulée (${M.attR} récup.)`:``}</p><p class="m">Plus fatigués : ${M.a[0].pl.filter(p=>p.i>0).sort((a,b)=>b.fat-a.fat).slice(0,3).map(p=>p.n+` `+Math.round(p.fat*100)+`%`).join(` · `)}</p><p class="m">${M.log.slice(0,5).join(`<br>`)}</p>${M.over?`<p><b>${M.res}</b></p><button class="pri" onclick="quit()">Continuer</button>`:``}`;
for(const q in M.fx){}[[`SUPÉRIORITÉ`,`sup`],[`PROTÈGE`,`prot`],[`3 SECONDES`,`cp`],[`COMPACT`,`comp`],[`PROFONDEUR`,`deep`]].forEach(([n,f])=>{const e=$(`b_`+n);if(e)e.className=M.fx[f]>0?`fx`:``})}
